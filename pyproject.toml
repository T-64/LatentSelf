[project]
name = "latentself"
version = "0.2.0"
description = "Local personal data base over AI chat history: search, profile, recommendation, writing"
requires-python = ">=3.12"
dependencies = ["numpy", "mcp>=1.29,<3"]

[project.optional-dependencies]
topics = ["igraph", "leidenalg"]

[project.scripts]
lself = "latentself.cli:main"
latentself-mcp = "latentself.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["latentself*"]
